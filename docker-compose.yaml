services:
  postgres:
    restart: always
    container_name: brev-postgres
    image: postgres
    ports:
      - '5440:5432'
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
  pdfgenerator:
    image: ghcr.io/navikt/aap-pdfgenerator-saksbehandling:latest
    platform: linux/amd64
    ports:
      - "8020:8080"
  sanity-proxy:
    image: ghcr.io/navikt/aap-brev-sanity-proxy:latest
    platform: linux/amd64
    ports:
      - "8787:8087"
    environment:
      SANITY_API_READ_TOKEN: ${SANITY_API_READ_TOKEN}
      SANITY_PROJECT_ID: 948n95rd
      SANITY_PERSPECTIVE: drafts
      PDFGENERATOR_SAKSBEHANDLING_URL: http://pdfgenerator:8020
      SANITY_DATASET: production
      NODE_ENV: development
